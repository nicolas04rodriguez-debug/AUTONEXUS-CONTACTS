[project]
name = "urbex-crm"
version = "0.1.0"
description = "Urbex outreach CRM: bucketed B2B cold email for automotive dealers and construction companies, driven from your phone via Telegram."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "dnspython>=2.6",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
    "python-telegram-bot>=21.0",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
urbex = "urbex_crm.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["urbex_crm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
